{% extends "base.html" %}
{% block title %}Register — OverWatch{% endblock %}
{% block content %}
<section class="card">
  <h2>Register</h2>
  {% if bootstrap %}
    <p class="hint">This is the first account on this install, so it will be
      created as an <strong>administrator</strong>.</p>
  {% endif %}
  <form method="post" class="stack">
    {{ csrf_field() }}
    <label>Username <input type="text" name="username" required autofocus></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn" type="submit">Register</button>
  </form>
  <p><a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
